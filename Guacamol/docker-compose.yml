version: '3.8'

services:
  # 1. Le "Cerveau" : Gère les protocoles RDP, SSH, VNC en tâche de fond
  guacd:
    container_name: guacd
    image: guacamole/guacd:latest
    restart: unless-stopped
    networks:
      - guac_network

  # 2. La Base de Données : Stocke les utilisateurs, mots de passe et logs
  postgres:
    container_name: postgres_guac
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: VotreMotDePasseTresSecurise!
      POSTGRES_DB: guacamole_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - guac_network

  # 3. L'Interface Web : Ce que l'utilisateur voit (Le portail de connexion)
  guacamole:
    container_name: guacamole_web
    image: guacamole/guacamole:latest
    restart: unless-stopped
    ports:
      - "8080:8080" # Port exposé sur votre réseau LAN (VLAN 10)
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRES_HOSTNAME: postgres
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: VotreMotDePasseTresSecurise!
      # BONUS JURY : Décommentez la ligne ci-dessous pour activer le MFA (Google Authenticator)
      # EXTENSIONS: auth-totp 
    depends_on:
      - guacd
      - postgres
    volumes:
      # Dossier local pour stocker les enregistrements vidéo d'audit
      - ./recordings:/var/lib/guacamole/recordings 
    networks:
      - guac_network

networks:
  guac_network:
    driver: bridge # Réseau virtuel privé interne à Docker

volumes:
  postgres_data: # Volume persistant pour ne pas perdre la BDD au redémarrage